<!DOCTYPE html>
<html>
  <head>
    <title>RepoTracker AR Test</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #ui {
        position: fixed; bottom: 20px; width: 100%;
        text-align: center; color: #00ffcc; z-index: 10;
        font-family: sans-serif; text-shadow: 2px 2px 4px #000;
      }
    </style>
  </head>

  <body>
    <div id="ui">
      <h2>RepoTracker AR Cam</h2>
      <p>Look up at the sky!</p>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <img id="aurora" src="https://psyge.github.io/repobeetta/revontulet.png">
      </a-assets>

      <a-entity 
        geometry="primitive: plane; width: 30; height: 15"
        material="src: #aurora; transparent: true; opacity: 0.7; shader: flat; side: double"
        position="0 15 -20"
        rotation="90 0 0"
        animation="property: position; to: 5 15 -25; dur: 8000; dir: alternate; loop: true">
      </a-entity>

      <a-camera gps-camera rotation-reader></a-camera>
      
    </a-scene>
  </body>
</html>
