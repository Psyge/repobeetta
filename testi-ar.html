<!DOCTYPE html>
<html>
  <head>
    <title>RepoTracker AR Test</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #ui {
        position: fixed; bottom: 20px; width: 100%;
        text-align: center; color: #00ffcc; z-index: 10;
        font-family: sans-serif; text-shadow: 2px 2px 4px #000;
      }
    </style>
  </head>

  <body>
    <div id="ui">
      <h2>RepoTracker AR Cam</h2>
      <p>Look up at the sky!</p>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets timeout="10000">
        <img id="aurora-tex" src="https://psyge.github.io/repobeetta/reposet22.png" crossorigin="anonymous">
      </a-assets>

      <a-entity 
        geometry="primitive: plane; width: 60; height: 30"
        material="src: #aurora-tex; transparent: true; opacity: 0.6; shader: flat; blending: additive; side: double;"
        position="0 20 -40"
        rotation="90 0 0"
        animation="property: position; to: 10 25 -45; dur: 15000; dir: alternate; loop: true; easing: easeInOutSine">
      </a-entity>

      <a-entity 
        geometry="primitive: plane; width: 80; height: 40"
        material="src: #aurora-tex; transparent: true; opacity: 0.4; shader: flat; blending: additive; side: double;"
        position="-10 22 -50"
        rotation="90 15 0"
        animation="property: rotation; to: 90 25 5; dur: 20000; dir: alternate; loop: true; easing: easeInOutSine">
      </a-entity>

      <a-camera rotation-reader></a-camera>
      
    </a-scene>
  </body>
</html>
