<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Revontulikartta - Reaaliaikainen seuranta</title>
    
    <link rel="stylesheet" href="../modern.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
   
</head>
<body class="map-page">

    <header>
        <div class="header-left">
            <div class="menu-trigger" onclick="toggleMenu()">☰ MENU</div>
            <img src="../repo-neon.png" alt="RepoTracker" class="logo">
        </div>
        <div class="search-trigger" onclick="toggleSearch()">🔍</div>
    </header>

    <div class="map-wrapper">
        <div id="map"></div>
        
        <div class="map-controls">
            <button class="control-btn" id="locate-btn" title="Oma sijainti">📍</button>
            <button class="control-btn" id="forecast-btn" title="Ennuste">📊</button>
            <div class="toggle-container">
                    <span class="toggle-label">Show Places</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-places">
                        <span class="slider"></span>
                    </label>
                </div>
        </div>
        
        <div id="kp-info-box" class="kp-floating-badge">
            <span id="kpVal">--</span> KP
        </div>
    </div>
<div id="forecast-popup" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:9999; align-items:center; justify-content:center; backdrop-filter:blur(5px);">
    <div style="background:#1a1a1a; padding:20px; border-radius:15px; width:90%; max-width:600px; border:1px solid var(--border-dim);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 style="margin:0;">3-Day Forecast</h3>
            <button id="close-forecast" style="background:none; border:none; color:#fff; font-size:24px; cursor:pointer;">&times;</button>
        </div>
        <div style="height:300px;"><canvas id="kpChart"></canvas></div>
    </div>
</div>
    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2026 RepoTracker | <a href="/privacy/">Tietosuoja</a></p>
            <div class="social-links">
                </div>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script src="../markers.js"></script>
</body>
</html>
