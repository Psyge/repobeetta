<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Revontulikartta - Reaaliaikainen seuranta</title>
    
    <link rel="stylesheet" href="../modern.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
   
</head>
<body>

    <header class="main-header">
        <div class="logo">REPO<span>TRACKER</span></div>
        <nav class="nav-menu">
            <a href="/">Etusivu</a>
            <a href="/map/" class="active">Kartta</a>
            <a href="/faq/">UKK</a>
        </nav>
    </header>

    <div class="map-wrapper">
        <div id="map"></div>
        
        <div class="map-controls">
            <button class="control-btn" id="locate-btn" title="Oma sijainti">📍</button>
            <button class="control-btn" id="forecast-btn" title="Ennuste">📊</button>
        </div>
        
        <div id="kp-info-box" class="kp-floating-badge">
            <span id="kpVal">--</span> KP
        </div>
    </div>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2026 RepoTracker | <a href="/privacy/">Tietosuoja</a></p>
            <div class="social-links">
                </div>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script src="../markers.js"></script>
</body>
</html>
