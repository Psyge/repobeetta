<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact & Feedback - RepoTracker</title>
<link rel="stylesheet" href="style.css"> <!-- Käytä samaa CSS-tiedostoa -->
</head>
<body>

<header class="banner">
  <div id="menu-btn">☰</div>
  <div class="language-switch">
    <button onclick="setLanguage('fi')">Suomi</button> 
    <button onclick="setLanguage('en')">English</button>
  </div>
  <div class="banner-left">
    <img src="repo-neon.png" alt="RepoTracker Logo" class="logo">
    <div class="banner-right">
    <a href="https://instagram.com/repotracker_" target="_blank" class="social-btn instagram">
      <img src="ig-icon.png" alt="Instagram" class="icon">
    </a>
    <a href="https://www.buymeacoffee.com/repotracker" target="_blank">
    <img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png" alt="Buy Me a Coffee" style="height: 50px; width: auto;"></a>
  </div>
  <nav id="menu">
    <a href="index.html" id="menu-home">Front page</a>
    <a href="contact.html" id="menu-contact">Contact / Feedback</a>
    <a href="#" id="show-help">Help</a>
  </nav>
</header>
  
<div id="help-popup" class="popup" style="display:none;">
  <div class="popup-content">
    <h2 id="help-title">How to use RepoTracker</h2>
    <p id="help-text">Click anywhere on the map...</p>
    <label><input type="checkbox" id="dont-show-again"> <span id="dont-show-text">Don’t show again</span></label>
    <button id="close-popup">Close</button>
  </div>
</div>


<!-- Lomake -->
<div id="container" style="margin-top:120px; text-align:center;">
  <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdnjjYcD008LAMcvo0g2riXAtQ80_Xtfy-2vQ2vrEo6xbSuXQ/viewform?embedded=true" width="640" height="800" frameborder="0" marginheight="0" marginwidth="0">Ladataan…</iframe>
</div>
<script src="language.js"></script>
<script>
async function loadLanguage(lang) {
  const response = await fetch('lang.json');
  translations = await response.json();
  currentLang = lang;

}

document.addEventListener('DOMContentLoaded', () => {
  loadLanguage(currentLang);
});
</script>
<script src="script.js"></script>

</body>
</html>
