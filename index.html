<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow" />  
<title>RepoTracker - Follow the northern lights</title>
<link rel="icon" href="iconi.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="mobile-splash">
        <img src="repo-neon.png" alt="RepoTracker Logo">
    </div>

    <header class="banner">
        <div id="menu-btn">☰</div>
        <div class="banner-left">
            <img src="repo-neon.png" alt="RepoTracker Logo" class="logo">
        </div>
        <div class="banner-right">
            <a href="https://instagram.com/repotracker_" target="_blank" class="social-btn"><img src="ig-icon.png" class="icon"></a>
            <a href="https://www.tiktok.com/@repotracker" target="_blank" class="social-btn"><img src="tiktok.png" class="icon"></a>
        </div>
        <nav id="menu">
            <a href="index.html">Front page</a>
            <a href="/faq/">FAQ</a>
            <a href="/contact/">Contact</a>
        </nav>
    </header>

    <div id="container">
        <div id="map">
            <button id="locate-btn">Can I See Northern Lights now?</button>
            <button id="markers-btn">Show markers</button>  
            <button id="forecast-btn">3 Day Forecast</button>  
        </div>
    </div>

    <div class="info-panel" id="kp-info-box">
        <div id="kp-restore-btn">KP</div>
        <div id="idesc">KP-INDEX</div>
        <div class="kp-badge" id="kpVal">--</div>
        <div id="kpDesc">Loading...</div>
    </div>

    <div class="mobile-only-panels">
        <div class="side-panel right-panel" id="actions-panel">
            <div class="panel-tab" id="actions-tab">⚙️</div>
            <div class="panel-content" id="actions-content">
                </div>
        </div>
        
        <div class="side-panel right-panel" id="social-panel">
            <div class="panel-tab" id="social-tab">📱</div>
            <div class="panel-content">
                <a href="https://instagram.com/repotracker_" target="_blank" class="soc-icon"><img src="ig-icon.png"></a>
                <a href="https://www.tiktok.com/@repotracker" target="_blank" class="soc-icon"><img src="tiktok.png"></a>
                <a href="https://www.buymeacoffee.com/repotracker" target="_blank" class="soc-icon">☕</a>
            </div>
        </div>
    </div>

    <section id="aurora-info" class="aurora-section">
        <div id="aurora-default">
            <h2>Northern Lights forecast</h2>
            <p>RepoTracker shows the Northern Lights in real time...</p>
        </div>
    </section>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
    <script src="markers.js"></script>
    

<!-- Kartta ja NOAA-data -->
<script src="script.js"></script>

<!-- Markerit -->
<script src="markers.js"></script>
<script>


// FUNKTIO: Hakee datan ja päivittää UI:n
let kpHideTimeout = null;

function handleKpVisibility() {
    // TÄRKEÄÄ: Varmista että ID on täsmälleen sama kuin HTML:ssä
    const kpBox = document.getElementById('kp-info-box'); 
    
    if (!kpBox) {
        console.error("Virhe: Elementtiä 'kp-info-box' ei löytynyt!");
        return;
    }

    // Työpöydällä (yli 768px) ei piiloteta mitään
    if (window.innerWidth > 768) {
        kpBox.classList.remove('fade-out');
        return;
    }

    // Nollataan vanha ajastin
    if (kpHideTimeout) clearTimeout(kpHideTimeout);

    // Poistetaan piilotusluokka, jotta laatikko näkyy
    kpBox.classList.remove('fade-out');

    // Asetetaan uusi piilotus 10 sekunnin päähän
    kpHideTimeout = setTimeout(() => {
        console.log("Piilotetaan Kp-laatikko...");
        kpBox.classList.add('fade-out');
    }, 8000); 
}

// Päivitetty fetchKPData
async function fetchKPData() {
    try {
        const res = await fetch('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json');
        const data = await res.json();
        
        if (data && data.length > 1) {
            const lastRow = data[data.length - 1];
            const kpVal = parseFloat(lastRow[1]);
            const badge = document.getElementById('kpVal');
            const desc = document.getElementById('kpDesc');
            if (badge) {
                badge.innerText = isNaN(kpVal) ? "--" : kpVal.toFixed(1);
                // (Värikoodit tähän väliin...)
              if (kpVal >= 5) {
                    badge.style.color = "#ff3366";
                    desc.innerText = "● Widely visible";
                    desc.style.color = "#ff3366";
                } else if (kpVal >= 3) {
                    badge.style.color = "#ffcc00";
                    desc.innerText = "● Chance to see";
                    desc.style.color = "#ffcc00";
                } else {
                    badge.style.color = "#00ffcc";
                    desc.innerText = "● No northern lights";
                    desc.style.color = "#00ffcc";
                }
            }
            
            
            // AKTIVOIDAAN PIILOTUS
            handleKpVisibility();
        }
    } catch(e) {
        console.error("Haku epäonnistui", e);
    }
}

// Alustus
document.addEventListener('DOMContentLoaded', () => {
    // 1. Haetaan Kp-data heti latauksessa
    fetchKPData();
if (window.innerWidth <= 768) {
    const actionsContent = document.getElementById('actions-content');
    const locateBtn = document.getElementById('locate-btn');
    const markersBtn = document.getElementById('markers-btn');
    const forecastBtn = document.getElementById('forecast-btn');

    // Siirretään napit kartan päältä paneelin sisään
    if (actionsContent) {
        actionsContent.appendChild(locateBtn);
        actionsContent.appendChild(forecastBtn);
        actionsContent.appendChild(markersBtn);
    }
}
    // 2. Splash Screen -logiikka
    const splash = document.getElementById('mobile-splash');
    if (splash) {
        setTimeout(() => {
            splash.classList.add('hidden');
            setTimeout(() => {
                splash.remove();
            }, 1000); 
        }, 3000);
    }

    // 3. KP-laatikon palautusnappi (MOBIILI)
    const restoreBtn = document.getElementById('kp-restore-btn');
    if (restoreBtn) {
        // TÄRKEÄÄ: Estetään klikkauksen vuotaminen alla olevaan karttaan
        // Käytetään Leafletin omaa työkalua, jos L (Leaflet) on ladattu
        if (typeof L !== 'undefined' && L.DomEvent) {
            L.DomEvent.disableClickPropagation(restoreBtn);
            L.DomEvent.disableScrollPropagation(restoreBtn);
        }

        restoreBtn.addEventListener('click', (e) => {
            // Estetään perus-eventit varmuuden vuoksi
            e.preventDefault();
            e.stopPropagation();
            
            console.log("Palautetaan Kp-laatikko...");
            handleKpVisibility(); 
        });
    }

    // 4. Tuodaan laatikko näkyviin kun ruutua kosketetaan (yleinen)
    document.addEventListener('touchstart', (e) => {
        // Jos kosketus osuu palautusnappiin, annetaan yllä olevan klikkaus-eventin hoitaa homma
        if (e.target.id === 'kp-restore-btn' || e.target.closest('#kp-restore-btn')) {
            return;
        }
        handleKpVisibility();
    });
});
  
</script>

</body>
</html>
